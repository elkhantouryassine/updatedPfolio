<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yassine El Khantour — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#020a3a; --navy:#04125f; --blue:#0b3fd0; --azure:#1e8bff; --cyan:#82ecff; --ice:#e9fbff; --red:#ff2e63;
  --display:'Anton','Impact','Haettenschweiler','Arial Narrow Bold',sans-serif;
  --body:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--ink);color:var(--ice);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
#app{position:relative;width:100%;height:100%;overflow:hidden}
.hidden{display:none!important}

/* ---------- Background ---------- */
.bg{position:absolute;inset:0;background:
  radial-gradient(120% 90% at 75% 55%,var(--azure) 0%,var(--blue) 38%,var(--navy) 72%,var(--ink) 100%);overflow:hidden}
.stripes{position:absolute;inset:-20%;background:repeating-linear-gradient(115deg,rgba(255,255,255,.055) 0 38px,transparent 38px 130px);animation:drift 14s linear infinite}
@keyframes drift{to{background-position:260px 0}}
.clock{position:absolute;left:50%;top:50%;width:150vmin;height:150vmin;margin:-75vmin 0 0 -75vmin;opacity:.2;animation:spin 160s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.clock text{font-family:var(--display);fill:var(--ice);font-size:22px;text-anchor:middle}
.clock .hand{transform-origin:0 0;animation:spin 30s steps(60) infinite}
.shards{position:absolute;inset:0;pointer-events:none}
.shard{position:absolute;background:linear-gradient(180deg,rgba(233,251,255,.28),rgba(130,236,255,.04));transform:skewX(-18deg);animation:rise linear infinite}
@keyframes rise{from{translate:0 12vh}to{translate:0 -120vh}}
.vignette{position:absolute;inset:0;background:radial-gradient(130% 100% at 50% 45%,transparent 55%,rgba(2,10,58,.75));pointer-events:none}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.07) 0 1px,transparent 1px 3px);pointer-events:none;mix-blend-mode:multiply}

/* ---------- Screens ---------- */
.screen{position:absolute;inset:0}

/* Title */
.title{z-index:6;display:flex;flex-direction:column;justify-content:center;padding:0 7vw;cursor:pointer;background:linear-gradient(100deg,rgba(2,10,58,.78) 0 52%,rgba(2,10,58,0) 85%)}
.title h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(3.2rem,12vw,9.5rem);line-height:.95;letter-spacing:.01em;text-transform:uppercase;transform:skewX(-12deg);color:var(--ice);text-shadow:8px 7px 0 var(--blue)}
.title h1 span{display:block;margin-left:.6em;-webkit-text-stroke:2px var(--cyan);color:transparent;text-shadow:none}
.title .role{margin:2.2vh 0 0 .6em;font-size:clamp(1.1rem,2.4vw,1.8rem);font-weight:600;letter-spacing:.12em;transform:skewX(-12deg);color:var(--cyan)}
.title .press{margin:7vh 0 0 .6em;display:inline-block;align-self:flex-start;padding:.35em 1.4em;background:var(--ice);color:var(--navy);font-family:var(--display);font-size:clamp(1.2rem,2.6vw,2rem);letter-spacing:.1em;transform:skewX(-12deg);box-shadow:7px 6px 0 var(--ink);animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.title .note{margin:2vh 0 0 .6em;font-size:1.05rem;opacity:.75;letter-spacing:.04em}

/* Menu screen */
#menuScreen{z-index:3}
.hud{position:absolute;top:2.2vh;left:3vw;right:3vw;display:flex;justify-content:space-between;align-items:flex-start;z-index:5;transform:translateY(-140%);transition:transform .6s cubic-bezier(.2,.9,.2,1) .15s}
.on .hud{transform:none}
.date{display:flex;align-items:center;gap:14px;transform:skewX(-10deg)}
.date .md{font-family:var(--display);font-size:clamp(2.4rem,6vh,3.8rem);line-height:1;text-shadow:4px 4px 0 var(--ink)}
.date .wd{display:block;font-family:var(--display);font-size:clamp(1rem,2.6vh,1.5rem);background:var(--ice);color:var(--navy);padding:0 .5em;letter-spacing:.08em}
.moon{width:clamp(44px,8vh,64px);height:clamp(44px,8vh,64px);filter:drop-shadow(3px 3px 0 var(--ink))}
.sndbtn{display:flex;align-items:flex-end;gap:10px;padding:.35em .9em;background:rgba(2,10,58,.7);border:2px solid var(--cyan);transform:skewX(-10deg);font-weight:700;letter-spacing:.08em}
.eq{display:flex;gap:3px;align-items:flex-end;height:18px}
.eq i{width:4px;background:var(--cyan);height:100%;transform-origin:bottom;animation:eq .7s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.25s}.eq i:nth-child(3){animation-delay:-.5s}
.sndbtn.off .eq i{animation:none;transform:scaleY(.2);background:var(--ice)}
@keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}

.ghost{position:absolute;left:-1vw;bottom:9vh;font-family:var(--display);font-size:clamp(6rem,28vh,19rem);line-height:.85;white-space:nowrap;color:transparent;-webkit-text-stroke:2px rgba(233,251,255,.28);transform:skewX(-12deg);pointer-events:none;z-index:1;opacity:.9}
.ghost.pop{animation:ghostin .35s cubic-bezier(.2,.9,.2,1)}
@keyframes ghostin{from{opacity:0;translate:-8vw 0}to{opacity:.9;translate:0 0}}

/* Portrait */
.portrait{position:absolute;left:3vw;top:10vh;bottom:11vh;width:40vw;z-index:2;transform:translateX(-120%);transition:transform .7s cubic-bezier(.2,.9,.2,1) .1s,opacity .4s}
.on .portrait{transform:none}
.in-section .portrait{transform:translateX(-60%) scale(.9);opacity:0;pointer-events:none}
.portrait svg.fig{position:absolute;left:0;bottom:0;height:100%;width:100%;overflow:visible}
.card{position:absolute;left:1vw;bottom:3vh;min-width:260px;padding:10px 22px 12px 18px;background:rgba(2,10,58,.88);border-left:6px solid var(--cyan);transform:skewX(-10deg);box-shadow:8px 8px 0 rgba(2,10,58,.55)}
.card .nm{font-family:var(--display);font-size:clamp(1.3rem,3.2vh,1.9rem);letter-spacing:.03em}
.card .lv{font-weight:700;color:var(--cyan);letter-spacing:.08em;font-size:1.05rem}
.bar2{display:flex;align-items:center;gap:8px;margin-top:5px;font-weight:700;font-size:.95rem}
.bar2 b{width:2.2em;color:var(--ice)}
.bar2 .tr{flex:1;height:9px;background:rgba(255,255,255,.18)}
.bar2 .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--azure),var(--cyan))}
.bar2.sp .tr i{background:linear-gradient(90deg,#c13a8c,#ff8fc7)}

/* Menu list */
.menu{--mw:min(500px,46vw);position:absolute;z-index:4;top:50%;width:var(--mw);left:calc(100% - var(--mw) - 6vw);transform:translateY(-50%);display:flex;flex-direction:column;gap:clamp(2px,1vh,10px);transition:left .6s cubic-bezier(.2,.9,.2,1),width .6s cubic-bezier(.2,.9,.2,1)}
.in-section .menu{--mw:25vw;left:2.5vw}
.mi{position:relative;display:block;width:100%;text-align:right;font-family:var(--display);font-size:clamp(1.7rem,6.3vh,3.6rem);line-height:1.12;letter-spacing:.04em;padding:.04em .55em .04em .3em;color:var(--ice);text-shadow:3px 3px 0 var(--ink);transform:translateX(var(--off,0px)) skewX(-12deg);transition:transform .16s cubic-bezier(.2,.9,.3,1.3),font-size .6s;opacity:0}
.on .mi{animation:itemin .5s cubic-bezier(.2,.9,.2,1) both;animation-delay:calc(var(--n)*55ms + 350ms)}
@keyframes itemin{from{opacity:0;translate:40vw 0}to{opacity:1;translate:0 0}}
.mi .bar{position:absolute;inset:-3px -18px -3px -34px;background:linear-gradient(90deg,var(--azure),var(--ice) 30%,#fff);transform:scaleX(0);transform-origin:100% 50%;transition:transform .17s cubic-bezier(.2,.9,.3,1.2);z-index:-1}
.mi .t{position:relative;display:inline-block}
.mi.sel{color:var(--navy);text-shadow:none;transform:translateX(calc(var(--off,0px) - 26px)) skewX(-12deg) scale(1.05);filter:drop-shadow(7px 6px 0 #02104f);z-index:2}
.mi.sel .bar{transform:scaleX(1)}
.mi.sel .t::before{content:"";position:absolute;left:-.8em;top:50%;margin-top:-.28em;border:.28em solid transparent;border-left:.5em solid var(--red);animation:nudge .5s ease-in-out infinite alternate}
@keyframes nudge{to{translate:6px 0}}
.mi.flash .bar{animation:flash .3s steps(2) 2}
@keyframes flash{50%{background:var(--cyan)}}
.in-section .mi{font-size:clamp(1rem,3.5vh,1.7rem)}

/* Description bar */
.desc{position:absolute;left:0;right:0;bottom:0;height:11vh;min-height:64px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:2vw;padding:0 3vw;background:linear-gradient(90deg,var(--ink),var(--navy));clip-path:polygon(0 22%,100% 0,100% 100%,0 100%);border-top:0;transform:translateY(110%);transition:transform .6s cubic-bezier(.2,.9,.2,1) .2s}
.on .desc{transform:none}
.desc::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--cyan);transform-origin:left;clip-path:polygon(0 0,100% 0,100% 100%,0 100%);display:none}
.desc-text{font-size:clamp(1.15rem,3vh,1.7rem);font-weight:600;letter-spacing:.02em;padding-top:1.5vh}
.hints{display:flex;gap:1.2em;flex-wrap:wrap;justify-content:flex-end;padding-top:1.5vh;font-weight:600;font-size:1.05rem;color:var(--cyan)}
.hints kbd{font-family:var(--display);font-size:.95em;background:var(--ice);color:var(--navy);padding:0 .45em;margin-right:.3em;transform:skewX(-10deg);display:inline-block}

/* Panel */
.panel{position:absolute;z-index:4;top:11vh;bottom:13vh;left:31vw;right:3vw;background:linear-gradient(135deg,rgba(2,10,58,.93),rgba(4,18,95,.9));clip-path:polygon(2.5% 0,100% 0,97.5% 100%,0 100%);display:flex;flex-direction:column;transform:translateX(115%);transition:transform .55s cubic-bezier(.2,.9,.2,1);visibility:hidden}
.in-section .panel{transform:none;visibility:visible}
.panel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--cyan);transform:skewX(-6deg);transform-origin:top left}
.p-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 4.5% 8px 5.5%}
.p-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(2rem,6vh,3.4rem);letter-spacing:.04em;transform:skewX(-12deg);text-shadow:4px 4px 0 var(--blue)}
.backbtn{padding:.2em 1em;background:var(--ice);color:var(--navy);font-family:var(--display);letter-spacing:.08em;transform:skewX(-12deg);box-shadow:5px 5px 0 var(--ink)}
.p-body{flex:1;min-height:0;overflow:hidden;padding:0 4.5% 18px 5.5%;display:flex}
.page{flex:1;overflow:auto;padding-right:10px}
.split{flex:1;display:flex;gap:2.4vw;min-height:0;width:100%}
.entries{list-style:none;margin:0;padding:6px 14px 6px 0;width:34%;overflow:auto;display:flex;flex-direction:column;gap:6px;flex:none}
.en{display:block;width:100%;text-align:left;padding:.3em .8em;background:rgba(130,236,255,.1);border-left:5px solid var(--azure);transform:skewX(-10deg);transition:transform .12s,background .12s}
.en .et{display:block;font-weight:700;font-size:1.3rem;line-height:1.15}
.en .es{display:block;font-size:.98rem;opacity:.75}
.en.sel{background:var(--ice);color:var(--navy);border-left-color:var(--red);transform:skewX(-10deg) translateX(10px);box-shadow:5px 5px 0 var(--ink)}
.en.sel .es{opacity:.85}
.detail{flex:1;min-width:0;overflow:auto;padding:4px 10px 10px 0}
.detail.pop>*{animation:dtl .32s cubic-bezier(.2,.9,.2,1) both}
.detail.pop>*:nth-child(2){animation-delay:.04s}.detail.pop>*:nth-child(3){animation-delay:.08s}.detail.pop>*:nth-child(4){animation-delay:.12s}.detail.pop>*:nth-child(5){animation-delay:.16s}
@keyframes dtl{from{opacity:0;translate:36px 0}to{opacity:1;translate:0 0}}
.detail h3,.page h3{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,4.4vh,2.5rem);letter-spacing:.03em;line-height:1.05}
.sub{margin:.3em 0 .9em;color:var(--cyan);font-weight:700;font-size:1.2rem;letter-spacing:.05em}
.detail p,.detail li,.page p,.page li{font-size:1.28rem;line-height:1.42;max-width:62ch;font-weight:500}
.detail ul{margin:.2em 0 1em;padding-left:1.1em}
.detail li::marker{color:var(--cyan)}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:.4em 0 1em}
.chip{padding:.1em .8em;background:rgba(130,236,255,.14);border:2px solid var(--cyan);font-weight:700;font-size:1.08rem;transform:skewX(-12deg)}
.arcana{display:inline-flex;align-items:stretch;margin:0 0 1em;transform:skewX(-10deg);box-shadow:6px 6px 0 var(--ink)}
.arcana b{font-family:var(--display);font-weight:400;font-size:2.4rem;line-height:1;padding:.05em .45em;background:var(--ice);color:var(--navy)}
.arcana span{display:flex;align-items:center;padding:0 1em;background:var(--blue);font-weight:700;letter-spacing:.06em;font-size:1.15rem}
.pips{display:inline-flex;gap:5px;vertical-align:middle}
.pips i{width:22px;height:12px;background:rgba(255,255,255,.2);transform:skewX(-20deg)}
.pips i.on{background:linear-gradient(90deg,var(--azure),var(--cyan))}
.stat{display:flex;align-items:center;justify-content:space-between;gap:14px;max-width:520px;padding:.2em 0;border-bottom:1px solid rgba(130,236,255,.25);font-weight:700;font-size:1.3rem}
.stat span:first-child{letter-spacing:.03em}
.btn{display:inline-block;margin:.3em .8em .3em 0;padding:.25em 1.2em;background:var(--ice);color:var(--navy);font-family:var(--display);letter-spacing:.08em;text-decoration:none;font-size:1.25rem;transform:skewX(-12deg);box-shadow:6px 6px 0 var(--ink);transition:transform .12s}
.btn:hover{transform:skewX(-12deg) translate(-2px,-2px)}
.btn.alt{background:var(--blue);color:var(--ice)}
input[type=range]{width:min(320px,100%);accent-color:var(--cyan);vertical-align:middle}
.kv{display:grid;grid-template-columns:auto 1fr;gap:.2em 1.2em;font-size:1.25rem;font-weight:500}
.kv b{color:var(--cyan)}

/* Wipe */
#wipe{position:absolute;inset:0;z-index:20;pointer-events:none;background:linear-gradient(100deg,var(--ice) 0 30%,var(--azure) 30% 62%,var(--navy) 62%);display:none}

/* Scrollbars */
.detail,.entries,.page{scrollbar-width:thin;scrollbar-color:var(--cyan) transparent}

/* ---------- Mobile ---------- */
@media (max-width:820px){
  .menu{--mw:86vw;left:7vw;top:52%}
  .mi{font-size:clamp(1.6rem,6vh,2.6rem)}
  .in-section .menu{opacity:0;pointer-events:none}
  .portrait{width:70vw;left:-6vw;opacity:.45;top:12vh}
  .card{display:none}
  .ghost{font-size:clamp(5rem,20vw,9rem);bottom:12vh}
  .panel{left:3vw;right:3vw;top:10vh;bottom:12vh;clip-path:polygon(3% 0,100% 0,97% 100%,0 100%)}
  .split{flex-direction:column;gap:8px}
  .entries{width:100%;max-height:34%;padding-right:6px}
  .hints{display:none}
  .desc{justify-content:center}
  .detail p,.detail li{font-size:1.15rem}
  .sndbtn span.lbl{display:none}
}
@media (max-height:520px){
  .ghost{display:none}
}
@media (prefers-reduced-motion:reduce){
  .stripes,.clock,.clock .hand,.shard,.eq i,.title .press{animation:none}
  .mi,.mi .bar,.menu,.panel,.portrait,.hud,.desc{transition-duration:.01s}
  .on .mi{animation:none;opacity:1}
}
</style>
</head>
<body>
<div id="app">

  <div class="bg" aria-hidden="true">
    <div class="stripes"></div>
    <svg class="clock" id="clock" viewBox="-200 -200 400 400"></svg>
    <div class="shards" id="shards"></div>
    <div class="vignette"></div>
    <div class="scan"></div>
  </div>

  <!-- Title -->
  <div id="title" class="screen title" role="button" tabindex="0" aria-label="Press any key to open the menu">
    <h1>Yassine<span>El Khantour</span></h1>
    <div class="role">AI &amp; DATA SCIENCE ENGINEERING STUDENT</div>
    <div class="press">PRESS ANY KEY</div>
    <div class="note">Sound on for the full experience. Tap or click works too.</div>
  </div>

  <!-- Pause menu -->
  <main id="menuScreen" class="screen hidden">
    <header class="hud">
      <div class="date">
        <div class="md" id="md">10/11</div>
        <div><span class="wd" id="wd">SUN</span></div>
        <svg class="moon" id="moon" viewBox="-36 -36 72 72" aria-label="Moon phase"></svg>
      </div>
      <button class="sndbtn" id="sndbtn" aria-label="Toggle music"><span class="eq"><i></i><i></i><i></i></span><span class="lbl" id="sndlbl">MUSIC ON</span></button>
    </header>

    <div class="ghost" id="ghost" aria-hidden="true">INTRODUCTION</div>

    <section class="portrait" aria-hidden="true">
      <svg class="fig" viewBox="0 0 400 600" preserveAspectRatio="xMidYMax meet">
        <defs>
          <linearGradient id="bodyg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a2aa8"/><stop offset="1" stop-color="#020a3a"/></linearGradient>
          <g id="sil">
            <path d="M10 600 C22 470 110 428 160 412 L240 412 C290 428 378 470 390 600Z"/>
            <path d="M168 372 L232 372 L238 420 L162 420Z"/>
            <ellipse cx="200" cy="296" rx="64" ry="80"/>
            <path d="M128 296 C112 205 168 160 206 168 C256 164 296 206 274 296 C264 252 240 232 202 236 C166 238 140 256 128 296Z"/>
            <path d="M126 262 L96 300 L130 290Z M274 262 L306 304 L270 290Z M180 170 L168 128 L204 164Z M222 168 L252 132 L246 178Z"/>
          </g>
        </defs>
        <circle cx="200" cy="300" r="190" fill="none" stroke="rgba(130,236,255,.4)" stroke-width="3" stroke-dasharray="4 14"/>
        <circle cx="200" cy="300" r="150" fill="rgba(30,139,255,.28)"/>
        <use href="#sil" x="16" y="12" fill="#1e8bff" opacity=".7"/>
        <use href="#sil" fill="url(#bodyg)" stroke="#82ecff" stroke-width="3" stroke-linejoin="round"/>
        <path d="M126 304 C118 190 282 190 274 304" fill="none" stroke="#e9fbff" stroke-width="10" stroke-linecap="round"/>
        <rect x="110" y="288" width="28" height="60" rx="10" fill="#e9fbff"/>
        <rect x="262" y="288" width="28" height="60" rx="10" fill="#e9fbff"/>
        <path d="M150 420 L200 470 L250 420" fill="none" stroke="#82ecff" stroke-width="4"/>
      </svg>
      <div class="card">
        <div class="nm">YASSINE EL KHANTOUR</div>
        <div class="lv">AI ENGINEER &middot; IN TRAINING</div>
        <div class="bar2"><b>HP</b><div class="tr"><i style="width:92%"></i></div></div>
        <div class="bar2 sp"><b>SP</b><div class="tr"><i style="width:78%"></i></div></div>
      </div>
    </section>

    <nav class="menu" id="menu" aria-label="Main menu"></nav>

    <section class="panel" id="panel" aria-live="polite">
      <div class="p-head"><h2 id="pTitle">INTRODUCTION</h2><button class="backbtn" id="backBtn">BACK</button></div>
      <div class="p-body" id="pBody"></div>
    </section>

    <footer class="desc" id="descBar">
      <div class="desc-text" id="descText"></div>
      <div class="hints" id="hints"></div>
    </footer>
  </main>

  <div id="wipe"></div>
  <input type="file" id="file" accept="audio/*" hidden>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const app = $('app'), titleEl = $('title'), menuScreen = $('menuScreen'), menuEl = $('menu'),
      panel = $('panel'), pBody = $('pBody'), pTitle = $('pTitle'), ghost = $('ghost'),
      descText = $('descText'), sndbtn = $('sndbtn'), sndlbl = $('sndlbl'), fileInput = $('file');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* If you host your own audio file next to this page, put its path here and it replaces the built-in loop. */
const CUSTOM_TRACK_URL = '';

/* ======================================================================
   AUDIO — everything is synthesised live (original sounds, no samples)
   ====================================================================== */
const Audio_ = (() => {
  let ctx, master, musicGain, sfxGain, noiseBuf, timer = null, nextTime = 0, step = 0;
  let musicOn = true, musicVol = .6, sfxVol = .8, customEl = null, customName = '';
  const BPM = 90, stepDur = 60 / BPM / 4;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const prog = [
    { bass: 45, tones: [57, 60, 64, 67] },   // Am7
    { bass: 41, tones: [53, 57, 60, 64] },   // Fmaj7
    { bass: 36, tones: [55, 60, 64, 67] },   // C
    { bass: 43, tones: [55, 59, 62, 64] }    // G6
  ];

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    master = ctx.createGain(); master.gain.value = .9;
    master.connect(comp); comp.connect(ctx.destination);

    return;
  }
  const list = s.entries.map((e, i) => `<li><button class="en" tabindex="-1" data-e="${i}"><span class="et">${e.t}</span><span class="es">${entryText(e.s)}</span></button></li>`).join('');
  pBody.innerHTML = `<div class="split"><ul class="entries" id="entries">${list}</ul><article class="detail" id="detail"></article></div>`;
  [...pBody.querySelectorAll('.en')].forEach(b => b.addEventListener('click', () => { b.blur(); if (+b.dataset.e !== entry) { setEntry(+b.dataset.e); } else confirmEntry(); }));
  setEntry(keepEntry ? entry : 0, true, true);
}

function detailHTML(e) {
  if (e.detail) return `<h3>${e.t}</h3><p class="sub">${entryText(e.s)}</p><div>${e.detail()}</div>`;
  let h = `<h3>${e.t}</h3><p class="sub">${entryText(e.s)}</p>`;
  if (e.extra) h += `<div>${e.extra}</div>`;
  if (e.bullets) h += `<ul>${e.bullets.map(b => `<li>${b}</li>`).join('')}</ul>`;
  if (e.body) h += `<p>${e.body}</p>`;
  if (e.tags) h += chips(e.tags);
  if (e.href) h += `<a class="btn" href="${e.href}" target="_blank" rel="noopener noreferrer">${e.cta}</a>`;
  return h;
}

function setEntry(i, silent, noAnim) {
  const s = SECTIONS[sel]; if (s.type !== 'list') return;
  const n = s.entries.length;
  const prev = entry;
  entry = (i + n) % n;
  const btns = [...pBody.querySelectorAll('.en')];
  btns.forEach((b, k) => b.classList.toggle('sel', k === entry));
  btns[entry].scrollIntoView({ block: 'nearest' });
  const d = $('detail'); d.innerHTML = detailHTML(s.entries[entry]);
  if (!noAnim) { d.classList.remove('pop'); void d.offsetWidth; d.classList.add('pop'); }
  d.scrollTop = 0;
  bindDetail();
  if (!silent && prev !== entry) sfx.move();
}

function refreshEntries() {
  const s = SECTIONS[sel]; if (s.type !== 'list') return;
  [...pBody.querySelectorAll('.en')].forEach((b, k) => { b.querySelector('.es').textContent = entryText(s.entries[k].s); });
  const d = $('detail'); const st = d.scrollTop; d.innerHTML = detailHTML(s.entries[entry]); d.scrollTop = st; bindDetail();
}

function bindDetail() {
  pBody.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {
    const a = b.dataset.act;
    if (a === 'music') toggleMusic(); else if (a === 'file') fileInput.click();
    else if (a === 'builtin') { Audio_.useBuiltIn(); sfx.confirm(); refreshEntries(); updateSnd(); }
    b.blur();
  }));
  pBody.querySelectorAll('[data-range]').forEach(r => r.addEventListener('input', () => {
    const v = r.value / 100;
    if (r.dataset.range === 'music') Audio_.musicVol = v; else { Audio_.sfxVol = v; }
    [...pBody.querySelectorAll('.en')].forEach((b, k) => { b.querySelector('.es').textContent = entryText(SECTIONS[sel].entries[k].s); });
  }));
  pBody.querySelectorAll('[data-range]').forEach(r => r.addEventListener('change', () => { if (r.dataset.range === 'sfx') sfx.move(); r.blur(); }));
}

function confirmEntry() {
  const e = SECTIONS[sel].entries && SECTIONS[sel].entries[entry]; if (!e) return;
  if (e.confirm) { sfx.confirm(); e.confirm(); refreshEntries(); }
  else if (e.href) { sfx.confirm(); window.open(e.href, e.href.startsWith('mailto') ? '_self' : '_blank', 'noopener'); }
}

/* ---- Music controls ---- */
function updateSnd() {
  sndbtn.classList.toggle('off', !Audio_.musicOn);
  sndlbl.textContent = Audio_.musicOn ? 'MUSIC ON' : 'MUSIC OFF';
}
function toggleMusic() {
  Audio_.musicOn = !Audio_.musicOn; updateSnd(); sfx.confirm();
  if (mode === 'panel') refreshEntries();
}
sndbtn.addEventListener('click', () => { sndbtn.blur(); toggleMusic(); });
fileInput.addEventListener('change', () => {
  const f = fileInput.files && fileInput.files[0];
  if (f) { Audio_.loadFile(f); if (!Audio_.musicOn) Audio_.musicOn = true; updateSnd(); refreshEntries(); sfx.confirm(); }
  fileInput.value = '';
});
$('backBtn').addEventListener('click', e => { e.currentTarget.blur(); closeSection(); });

/* ---- Start ---- */
function start() {
  if (screen !== 'title') return;
  screen = 'menu';
  Audio_.init();
  sfx.open();
  buildMenu(); setHints(); updateSnd();
  const reveal = () => {
    titleEl.classList.add('hidden');
    menuScreen.classList.remove('hidden');
    select(0, true);
    void menuScreen.offsetWidth;
    app.classList.add('on');
  };
  wipe(reveal);
}
titleEl.addEventListener('click', start);

/* ---- Keyboard ---- */
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (screen === 'title') {
    if (['Shift', 'Control', 'Alt', 'Meta', 'Tab', 'CapsLock'].includes(k)) return;
    e.preventDefault(); start(); return;
  }
  if (k === 'm' || k === 'M') { toggleMusic(); return; }
  const s = SECTIONS[sel];
  if (mode === 'menu') {
    if (k === 'ArrowDown') { e.preventDefault(); select(sel + 1); }
    else if (k === 'ArrowUp') { e.preventDefault(); select(sel - 1); }
    else if (k === 'Enter' || k === ' ' || k === 'ArrowRight') { e.preventDefault(); openSection(sel); }
  } else {
    const en = s.entries && s.entries[entry];
    if (k === 'Escape' || k === 'Backspace') { e.preventDefault(); closeSection(); }
    else if (k === 'ArrowLeft') {
      e.preventDefault();
      if (en && en.adjust) { en.adjust(-1); refreshEntries(); } else closeSection();
    }
    else if (k === 'ArrowRight') { if (en && en.adjust) { e.preventDefault(); en.adjust(1); refreshEntries(); } }
    else if (k === 'ArrowDown' || k === 'ArrowUp') {
      e.preventDefault();
      const dir = k === 'ArrowDown' ? 1 : -1;
      if (s.type === 'list') setEntry(entry + dir);
      else { const pg = $('pageScroll'); if (pg) pg.scrollBy({ top: dir * 90, behavior: 'smooth' }); }
    }
    else if (k === 'Enter' || k === ' ') {
      if (document.activeElement && document.activeElement.tagName === 'A') return;
      e.preventDefault(); confirmEntry();
    }
  }
});
document.addEventListener('keyup', e => { if (e.key === ' ' && screen !== 'title') e.preventDefault(); });

/* Mouse wheel / touch swipe to move the cursor in the menu */
let wheelLock = 0;
menuEl.addEventListener('wheel', e => {
  if (mode !== 'menu' || Date.now() < wheelLock) return;
  wheelLock = Date.now() + 120; e.preventDefault(); select(sel + (e.deltaY > 0 ? 1 : -1));
}, { passive: false });
})();
</script>
</body>
</html>
